
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài 23 - Đèn kéo quân</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 15px;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    background: linear-gradient(135deg, #101b46, #7c2d12, #421b55);
    overflow-x: hidden;
}

h1 {
    margin-top: 25px;
    color: #ffdf70;
    text-shadow: 0 0 12px orange;
}

p { line-height: 1.6; }

.scene {
    width: 320px;
    height: 300px;
    margin: 25px auto 10px;
    perspective: 1000px;
}

.lantern {
    position: relative;
    width: 150px;
    height: 180px;
    margin: 55px auto;
    transform-style: preserve-3d;
    animation: xoay 12s linear infinite;
}

.face {
    position: absolute;
    top: 0;
    left: 0;
    width: 150px;
    height: 180px;
    overflow: hidden;
    border: 4px solid #ffd166;
    border-radius: 8px;
    background: white;
    box-shadow: 0 0 15px #ffbd45;
    cursor: pointer;
}

.face img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.face:hover {
    border-color: white;
    box-shadow: 0 0 25px white;
}

.face:nth-child(1) {
    transform: rotateY(0deg) translateZ(130px);
}
.face:nth-child(2) {
    transform: rotateY(60deg) translateZ(130px);
}
.face:nth-child(3) {
    transform: rotateY(120deg) translateZ(130px);
}
.face:nth-child(4) {
    transform: rotateY(180deg) translateZ(130px);
}
.face:nth-child(5) {
    transform: rotateY(240deg) translateZ(130px);
}
.face:nth-child(6) {
    transform: rotateY(300deg) translateZ(130px);
}

@keyframes xoay {
    from { transform: rotateY(0deg); }
    to { transform: rotateY(360deg); }
}

.controls {
    max-width: 650px;
    margin: 15px auto;
}

button, .btn {
    display: inline-block;
    margin: 6px;
    padding: 12px 16px;
    border: none;
    border-radius: 9px;
    background: #ffd166;
    color: #432006;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
}

button:hover, .btn:hover {
    background: white;
}

#status {
    color: #ffe7a0;
    font-weight: bold;
}

@media (max-width: 420px) {
    .scene {
        transform: scale(.82);
        transform-origin: top center;
        margin-bottom: -35px;
    }
}
</style>
</head>
<body>

<h1>🏮 ĐÈN KÉO QUÂN 🏮</h1>
<p>
    Sinh viên: Huỳnh Nam Khánh |
    MSSV: 241A010493
</p>
<p>Đèn gồm 6 mặt hình ảnh, tự động xoay vòng tròn.</p>

<div class="scene">
    <div class="lantern" id="lantern">
        <div class="face"><img src="images/anh1.jpg" alt="Ảnh 1"></div>
        <div class="face"><img src="images/anh2.jpg" alt="Ảnh 2"></div>
        <div class="face"><img src="images/anh3.jpg" alt="Ảnh 3"></div>
        <div class="face"><img src="images/anh4.jpg" alt="Ảnh 4"></div>
        <div class="face"><img src="images/anh5.jpg" alt="Ảnh 5"></div>
        <div class="face"><img src="images/anh6.jpg" alt="Ảnh 6"></div>
    </div>
</div>

<div class="controls">
    <button onclick="xoayCham()">🐢 Xoay chậm</button>
    <button onclick="xoayNhanh()">🚀 Xoay nhanh</button>
    <button onclick="dungDen()">⏸ Dừng đèn</button>
    <button onclick="tiepTuc()">▶ Tiếp tục</button>
</div>

<p id="status">Trạng thái: Đang xoay chậm</p>
<p>Rê chuột vào đèn để tạm dừng, đưa chuột ra ngoài để tiếp tục.</p>

<a class="btn" href="index.html">🏠 Trang chủ</a>
<a class="btn" href="bai22.html">🖼️ Xem Bài 22</a>

<script>
const den = document.getElementById("lantern");
const statusText = document.getElementById("status");

let tocDo = 12;
let dangChay = true;
let dangReChuot = false;

function capNhat() {
    den.style.animationDuration = tocDo + "s";

    if (dangChay && !dangReChuot) {
        den.style.animationPlayState = "running";
        statusText.textContent =
            "Trạng thái: " +
            (tocDo === 3 ? "Đang xoay nhanh" : "Đang xoay chậm");
    } else {
        den.style.animationPlayState = "paused";
        statusText.textContent = dangReChuot && dangChay
            ? "Trạng thái: Tạm dừng khi rê chuột"
            : "Trạng thái: Đã dừng";
    }
}

function xoayCham() {
    tocDo = 12;
    dangChay = true;
    capNhat();
}

function xoayNhanh() {
    tocDo = 3;
    dangChay = true;
    capNhat();
}

function dungDen() {
    dangChay = false;
    capNhat();
}

function tiepTuc() {
    dangChay = true;
    capNhat();
}

den.addEventListener("mouseenter", function() {
    dangReChuot = true;
    capNhat();
});

den.addEventListener("mouseleave", function() {
    dangReChuot = false;
    capNhat();
});
</script>

</body>
</html>
